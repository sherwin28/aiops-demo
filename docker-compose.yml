version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"      # FastAPI
      - "4317:4317"      # OTLP gRPC
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
